name: kris_builds
publish_to: none
environment:
  sdk: ^3.10.0
workspace:
  - packages/core/design_system
  - packages/features/auth
  - packages/features/todo
  - apps/example_app

dev_dependencies:
  melos: ^7.3.0

melos:
  command:
    bootstrap:
      environment:
        sdk: ^3.10.0
      dependencies:
        flutter_riverpod: ^2.5.0
        go_router: ^17.0.1
        hive: ^2.2.3
        hive_flutter: ^1.1.0

      dev_dependencies:
        flutter_lints: ^6.0.0
